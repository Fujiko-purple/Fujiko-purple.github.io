<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fujiko - 极简日系</title>
<script>
/* 主题初始化：在样式生效前设置，避免深色用户看到白屏闪烁 */
(function(){
  var t = localStorage.getItem('theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* 色卡：与 assets/style.css 保持同名同值 */
:root{
  --bg:#fafaf8; --text:#3a3a3a; --text-strong:#2a2a2a; --text-soft:#555;
  --faint:#aaa; --ghost:#ccc; --line:#eee; --line-strong:#ddd;
  --accent:#ec4899; --panel:#f5f3f7;
}
:root[data-theme="dark"]{
  --bg:#1b1a18; --text:#c9c5bd; --text-strong:#e8e4dc; --text-soft:#b0aca4;
  --faint:#6f6b64; --ghost:#524f49; --line:#2e2c28; --line-strong:#3a3833;
  --accent:#f472b6; --panel:#242220;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC','Georgia','SimSun',serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;position:relative;overflow-x:hidden}
/* 主题渐变只在点击切换按钮时启用；返回页面的纠正瞬间完成，避免闪烁 */
:root.theming body,:root.theming .nav-links a,:root.theming .header h1{transition:background-color 0.25s ease,color 0.25s ease,border-color 0.25s ease}

.particle{position:fixed;pointer-events:none;border-radius:50%;z-index:0;opacity:0}
@keyframes floatPetals{
  0%{transform:translateY(0)rotate(0deg)scale(0);opacity:0}
  10%{opacity:0.6}
  80%{opacity:0.3}
  100%{transform:translateY(calc(var(--d)*-1))rotate(var(--r))scale(1);opacity:0}
}

.container{position:relative;z-index:1;max-width:600px;width:100%;padding:80px 24px 60px}
.header{text-align:center;margin-bottom:60px}
.header .avatar{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 20px;transition:transform 0.3s ease;cursor:pointer}
.header .avatar:hover{transform:scale(1.12)}
.header .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.header h1{font-size:2rem;font-weight:400;letter-spacing:8px;margin-bottom:8px;color:var(--text-strong)}
.header .subtitle{font-size:0.82rem;color:var(--faint);letter-spacing:4px}

.nav-links{display:flex;flex-direction:column;margin-bottom:60px}
.nav-links a{display:flex;align-items:center;justify-content:space-between;padding:18px 16px;text-decoration:none;color:var(--text-soft);font-size:0.95rem;border-bottom:1px solid var(--line);transition:all 0.2s ease}
.nav-links a:first-child{border-top:1px solid var(--line)}
.nav-links a:hover{padding-left:20px}
.nav-links .arrow{color:var(--ghost);font-size:0.75rem;transition:transform 0.2s}
.nav-links a:hover .arrow{color:var(--accent);transform:translateX(3px)}
.nav-links .desc{font-size:0.75rem;color:var(--ghost);margin-left:auto;margin-right:12px}

.divider{text-align:center;margin:0 0 40px;color:var(--line-strong);font-size:0.8rem;letter-spacing:4px}
.footer{text-align:center;padding:24px;color:var(--ghost);font-size:0.75rem;letter-spacing:2px}
.theme-btn{position:fixed;top:16px;right:16px;z-index:10;background:none;border:none;font-size:1.15rem;cursor:pointer;padding:6px 8px;border-radius:6px;transition:background 0.15s}
.theme-btn:hover{background:var(--panel)}
</style>
</head>
<body>
<button class="theme-btn" id="themeToggle" aria-label="切换深浅色">🌙</button>
<div id="particles"></div>

<div class="container">
  <header class="header">
    <div class="avatar"><img src="assets/avatar.jpeg" alt="Fujiko"></div>
    <h1>Fujiko</h1>
    <p class="subtitle">学び · 創る · 遊ぶ</p>
  </header>

  <nav class="nav-links">
    <a href="notes/index.html"><span>📖 学习笔记</span><span class="desc">Python · 数据库 · Linux</span><span class="arrow">→</span></a>
    <a href="novels/index.html"><span>✍️ 小说创作</span><span class="desc">故事正在生长</span><span class="arrow">→</span></a>
    <a href="airp/index.html"><span>🎭 AIRP 体验</span><span class="desc">角色扮演心得</span><span class="arrow">→</span></a>
    <a style="color:#ddd;cursor:default"><span>🔮 更多分区</span><span class="desc">coming soon</span><span class="arrow">—</span></a>
  </nav>

  <div class="divider">* * *</div>
  <footer class="footer"><p>© 2026 Fujiko · 用 ❤️ 和 Markdown 维护</p></footer>
</div>

<script>
(function(){
  var c = document.getElementById('particles');
  if (!c) return;
  var colors = ['#f9a8d4','#f472b6','#fbcfe8','#e9d5ff','#c084fc','#fef3c7','#fde68a','#fff','#fce7f3','#fdf2f8'];
  for (var i = 0; i < 35; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var size = 3 + Math.random() * 7;
    var dur = 7 + Math.random() * 10;
    var x = Math.random() * 100;
    var y = 5 + Math.random() * 85;
    var d = 100 + Math.random() * 180;
    var r = (Math.random() - 0.5) * 360;
    var col = colors[Math.floor(Math.random() * colors.length)];
    var isBig = size > 7;
    p.style.width = size + 'px';
    p.style.height = size * (0.5 + Math.random() * 0.5) + 'px';
    p.style.background = col;
    p.style.borderRadius = isBig ? '50%' : (Math.random() > 0.5 ? '50%' : '40% 0 40% 0');
    p.style.left = x + '%';
    p.style.top = y + '%';
    p.style.setProperty('--d', d + 'px');
    p.style.setProperty('--r', r + 'deg');
    p.style.animation = 'floatPetals ' + dur + 's ease-in-out infinite';
    p.style.animationDelay = '-' + (Math.random() * dur) + 's';
    p.style.boxShadow = isBig ? '0 0 ' + (size * 4) + 'px ' + col : '0 0 ' + (size * 2) + 'px ' + col;
    if (isBig) p.style.opacity = '0.7';
    c.appendChild(p);
  }
})();
/* 深浅色手动切换：点击后记住选择（优先于系统设置） */
(function(){
  var b = document.getElementById('themeToggle');
  if (!b) return;
  function icon(){ b.textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'; }
  function apply(){
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    icon();
  }
  icon();
  var themingTimer;
  b.addEventListener('click', function(){
    var root = document.documentElement;
    var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.classList.add('theming');   /* 渐变动画只给点击切换，随后移除 */
    root.dataset.theme = next;
    localStorage.setItem('theme', next);
    icon();
    clearTimeout(themingTimer);
    themingTimer = setTimeout(function(){ root.classList.remove('theming'); }, 300);
  });
  /* 返回/前进从缓存恢复页面时不会重跑初始化脚本，这里重新应用最新主题 */
  window.addEventListener('pageshow', apply);
  /* 其他标签页改了主题，本页同步 */
  window.addEventListener('storage', function(e){ if (e.key === 'theme') apply(); });
})();
</script>
</body>
</html>
