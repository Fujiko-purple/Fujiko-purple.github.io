# ============ GitHub Pages 自动构建部署 ============
# 触发：push 到 main（或手动触发）
# 流程：node build.mjs 构建出完整站点（dist/）→ 直接部署到 Pages
# 效果：只需提交 content/ 或 site/ 的修改并推送，线上站点自动更新
#       dist/ 不入 git，仅在 CI 和本地预览时生成

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留最新一次部署，避免排队
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建全站
        run: node build.mjs

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
